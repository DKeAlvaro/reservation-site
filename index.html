<!DOCTYPE html>
<html lang="es" class="boot-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anzest Friends & Family</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preload" href="fonts/cascadia-code-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="images/logo-anzest.svg" as="image">
    <link rel="preload" href="images/black-goat.svg" as="image">
    <link rel="prefetch" href="reserva.html">
    <link rel="prefetch" href="anzest_styles.css">
    <link rel="stylesheet" href="anzest_styles.css">
    <noscript><style>html.boot-pending body{opacity:1}</style></noscript>
    <script>
        (function () {
            var done = false;
            function ready() {
                if (done) return;
                done = true;
                document.documentElement.classList.remove('boot-pending');
                document.documentElement.classList.add('boot-ready');
                document.dispatchEvent(new Event('bootready'));
            }
            function waitAssets() {
                var imgs = Array.prototype.map.call(document.images, function (img) {
                    if (img.complete) return Promise.resolve();
                    return new Promise(function (res) {
                        img.addEventListener('load', res);
                        img.addEventListener('error', res);
                    });
                });
                var fonts = (document.fonts && document.fonts.ready)
                    ? document.fonts.ready.catch(function () {})
                    : Promise.resolve();
                Promise.all([fonts].concat(imgs)).then(ready);
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', waitAssets);
            } else {
                waitAssets();
            }
            setTimeout(ready, 2500);
        })();
    </script>
</head>
<body>
    <div class="splash" id="splash">
        <div class="splash-inner">
            <div class="splash-visual" id="logoLink" onclick="navigateToReserva()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')navigateToReserva()">
                <div class="splash-img-wrap">
                    <img class="splash-img" id="logoSvg" src="images/logo-anzest.svg" alt="Anzest">
                </div>
            </div>
            <p class="splash-subtitle" id="subtitle">
                <span class="splash-goat-wrap">
                    <img class="splash-goat" id="goatSvg" src="images/black-goat.svg" alt="">
                </span>
                Inauguración Friends &amp; Family
            </p>
        </div>
    </div>

    <script>
        var reservaReady = fetch('reserva.html', { cache: 'force-cache' }).catch(function () {});

        function navigateToReserva() {
            var splash = document.getElementById('splash');
            splash.classList.add('fade-out');
            var minFade = new Promise(function (resolve) { setTimeout(resolve, 280); });
            Promise.all([minFade, reservaReady]).then(function () {
                location.href = 'reserva.html';
            });
        }

        function revealSplashChrome() {
            setTimeout(() => {
                document.getElementById('subtitle').classList.add('visible');
                document.getElementById('logoLink').classList.add('interactive');
            }, 1000);
        }
        if (document.documentElement.classList.contains('boot-ready')) {
            revealSplashChrome();
        } else {
            document.addEventListener('bootready', revealSplashChrome, { once: true });
        }
    </script>
</body>
</html>
